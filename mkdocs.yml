# ============================================================
# MkDocs + Material 天体数据库站（星野笔记）
# 页面由 scripts/gen_pages.py 从 docs/data/astro.json 生成，请勿手改生成产物
# 数据更新流程见 README.md
# ============================================================

# ---- 站点基本信息（按需修改） ----
site_name: 星野笔记
site_description: 星野笔记——可筛选、可排序的天体数据库：质量、半径、密度、表面温度、轨道与卫星数据，附深度科普文章
site_author: 御风研墨
site_url: https://astro-blog-eqt.pages.dev/

# ---- 主题 ----
theme:
  name: material
  language: zh

  # 深色默认 / 浅色可切换（天体贴图多为黑底太空照，深色页面不显黑色残边）
  palette:
    - scheme: slate                   # 深色（默认）
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换浅色模式
    - scheme: default                 # 浅色
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换深色模式

  # 侧边栏多级导航 / 站内搜索 / 体验特性
  features:
    - navigation.sections              # 侧边栏按章节分组（多级导航）
    - navigation.indexes               # 节索引页（天体库/数据集）可点击
    - navigation.top                   # 返回顶部按钮
    - search.suggest                   # 搜索输入建议
    - search.highlight                 # 搜索结果关键词高亮
    - content.code.copy                # 代码块一键复制

# ---- Markdown 扩展（科普类文章常用） ----
markdown_extensions:
  - meta                              # YAML frontmatter 支持（blog-pipeline 生成文章的头部元数据）
  - admonition                        # 提示框：!!! note / tip / warning
  - attr_list                         # 给元素加 class（首页专栏卡片用到）
  - md_in_html                        # 在 HTML 块中写 Markdown（首页专栏卡片用到）
  - pymdownx.details                  # 折叠块：??? 语法
  - pymdownx.superfences              # 代码块增强
  - toc:
      permalink: true                 # 标题右侧锚点链接

# ---- 插件：仅保留内置搜索 ----
# 中文站如需改善分词，可安装 jieba 后配置 lang: zh
plugins:
  - search

# ---- 自定义样式与脚本（天体数据库工具页） ----
extra_css:
  - stylesheets/site.css

extra_javascript:
  - js/astro-explore.js
  - js/compare.js
  - js/solar-embed.js

# ---- 导航结构 ----
# 首页 = 天体总览工具页；objects/ 与 data.md 由 scripts/gen_pages.py 自动生成维护
# 详情页（objects/<天体>.md）经首页卡片、天体库总表与详情页上下导航互相链接，sitemap 全量收录
# 数据集下载页（data.md）不放入导航：仅经 URL 直达 / sitemap 收录，不在界面提供入口
nav:
  - 天体总览: index.md
  - 天体对比: compare.md
  - 天体库: objects/index.md
  - 太阳系3D模型: solar-demo.md
